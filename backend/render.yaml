services:
  - type: web
    name: pcos360-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DEBUG_SQL
        value: false
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HEADERS
        value: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
